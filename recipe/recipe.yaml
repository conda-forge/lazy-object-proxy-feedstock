schema_version: 1

context:
  version: "1.13.0"

package:
  name: lazy-object-proxy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/lazy-object-proxy/lazy_object_proxy-${{ version }}.tar.gz
  sha256: ce34046cb021d69c72d05ddb83821ecfd4d2d0a5d43a93c5cd01c9e34779cf14

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
  host:
    - python
    - pip
    - setuptools >=80
    - setuptools-scm >=8
  run:
    - python

tests:
  - python:
      imports:
        - lazy_object_proxy
        - lazy_object_proxy.cext
      pip_check: true

about:
  license: BSD-2-Clause
  license_file: LICENSE
  summary: A fast and thorough lazy object proxy
  homepage: https://github.com/ionelmc/python-lazy-object-proxy
  repository: https://github.com/ionelmc/python-lazy-object-proxy
  documentation: https://python-lazy-object-proxy.readthedocs.org

extra:
  recipe-maintainers:
    - jakirkham
    - nehaljwani
    - ocefpaf
    - xylar
